name: umi
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip=22.1
  - pytorch=2.1.0
  - pytorch-cuda=12.1
  - torchvision=0.16.0
  - numpy=1.24
  - scipy=1.11
  - numba=0.57
  - pandas=2.1
  - py-opencv=4.7
  - ipykernel=6.23
  - matplotlib=3.7
  - av=10.0
  - pyyaml=6.0
  - tqdm=4.65
  - zarr=2.16
  - numcodecs=0.11
  - hydra-core=1.2.0
  - wandb>0.15
  - dill=0.3.7
  - einops=0.6.1
  - diffusers=0.18.2
  - scikit-video=1.1
  - gym=0.21.0
  # llvm-openmp=14 removed - Linux-only workaround that conflicts on Windows
  - python-lmdb=1.4
  - timm=0.9.7
  - scikit-fda=0.9
  - cython=0.29
  - accelerate=0.24
  - boto3=1.33
  # exiftool removed - Linux package
  - aiohttp=3.9
  - aiofiles=23.2
  - pip:
    - ray[default]==2.8.0
    - threadpoolctl==3.2
    # v4l2py removed - Linux-only (Video4Linux)
    # ur-rtde==1.5.6  # May need Windows build
    # spnav removed - Linux-only (SpaceMouse driver)
    - atomics==1.0.2
    - pynput==1.7.6
    - fastcrc==0.2
    - imagecodecs==2023.9.18
    - robomimic==0.2.0
    # free-mujoco-py removed - Linux-only, use mujoco instead
    - mujoco==3.1.1
    # robosuite removed - depends on mujoco-py
    # PyExifTool removed - depends on exiftool
